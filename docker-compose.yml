services:
  instagram-mcp:
    build: .
    image: instagram-mcp:latest
    container_name: instagram-mcp
    env_file: .env
    volumes:
      - ./data:/data
    # Default transport is streamable-http on 0.0.0.0:${MCP_PORT}, so Claude
    # Desktop (or any HTTP MCP client elsewhere on the LAN) can connect. For
    # local stdio use, spawn a one-shot `docker run` with MCP_TRANSPORT=stdio
    # in the env — the persistent HTTP service stays out of its way.
    ports:
      - "0.0.0.0:${MCP_PORT:-3224}:${MCP_PORT:-3224}"
    restart: unless-stopped

  # Static file server: exposes /data/public/<token>/<filename> over plain HTTP
  # so Meta's servers can fetch images for the Instagram publishing flow.
  # Terminate TLS in front — Caddy (on a remote VPS, reachable over Headscale)
  # reverse-proxies social.example.com -> <this-host>:${FILE_SERVER_PORT}.
  instagram-mcp-files:
    image: nginx:alpine
    container_name: instagram-mcp-files
    volumes:
      - ./data/public:/srv/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "0.0.0.0:${FILE_SERVER_PORT:-3223}:8080"
    restart: unless-stopped
