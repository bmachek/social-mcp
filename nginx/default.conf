server {
    listen 8080;
    server_name _;
    root /srv/public;
    server_tokens off;
    autoindex off;
    client_max_body_size 0;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location = / { return 404; }
    location ~ /\. { return 404; }

    # /<token>/<filename> — token is base64url, filename is anything without a slash.
    # try_files resolves the hardlink Created by the MCP server; everything else 404s.
    location ~ "^/[A-Za-z0-9_-]{16,}/[^/]+$" {
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri =404;
    }

    location / { return 404; }
}
